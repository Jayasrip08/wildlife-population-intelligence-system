version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wildlife_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=production
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wildlife_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
