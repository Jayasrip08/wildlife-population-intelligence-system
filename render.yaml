services:
  # Backend FastAPI Service
  - type: web
    name: wildlife-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wildlife-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend React Static Web Site
  - type: web
    name: wildlife-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wildlife-backend
          property: host

databases:
  - name: wildlife-db
    databaseName: wildlife_db
    plan: free
