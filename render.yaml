services:
  # Backend FastAPI Service
  - type: web
    name: wildlife-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wildlife-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend React Web Service
  - type: web
    name: wildlife-frontend
    runtime: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wildlife-backend
          property: host

databases:
  - name: wildlife-db
    databaseName: wildlife_db
    plan: free
